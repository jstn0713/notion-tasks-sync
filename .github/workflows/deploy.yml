# main 에 올리면(push) 자동으로 Cloudflare 에 배포해요. Actions 탭에서 Run workflow 로 직접 돌려도 돼요.
#   테스트 → Worker 배포 → 비밀값 등록 → 시험 실행(개수만 출력)
# 동기화 자체는 Cloudflare 가 5분마다 직접 실행해요. (GitHub 예약 실행은 쓰지 않아요)
# 로그에는 할 일 내용 없이 개수만 나와요.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "배포 뒤 무엇을 할까요"
        type: choice
        default: 시험 실행
        options:
          - 시험 실행
          - 지금 바로 동기화

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_STATE_PAGE_ID: ${{ secrets.NOTION_STATE_PAGE_ID }}
      NOTION_TODO_DS_ID: ${{ secrets.NOTION_TODO_DS_ID }}
      NOTION_SHOPPING_DS_ID: ${{ secrets.NOTION_SHOPPING_DS_ID }}
      # 텔레그램 실패 알림 (선택). routine-bot 과 같은 봇·같은 채팅방 번호를 써도 돼요.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KV_NAME: notion-tasks-sync-alerts
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 설치
        run: npm ci

      - name: 테스트
        run: npm run check && npm test

      - name: 비밀값 확인
        id: ready
        run: |
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN NOTION_TOKEN NOTION_STATE_PAGE_ID NOTION_TODO_DS_ID; do
            [ -z "${!k}" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=배포 건너뜀::GitHub Secrets 에 아직 없는 값:$missing — 넣은 뒤 Run workflow 를 눌러주세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 텔레그램 값 확인
        if: steps.ready.outputs.ok == 'true'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice title=텔레그램 알림 꺼짐::TELEGRAM_BOT_TOKEN 과 TELEGRAM_CHAT_ID 를 넣으면 실패 알림이 켜져요."
            exit 0
          fi
          token="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | grep -oE '[0-9]+:[A-Za-z0-9_-]+' | head -1 || true)"
          if [ -z "$token" ]; then
            echo "::error title=봇 토큰 모양이 이상해요::TELEGRAM_BOT_TOKEN 은 123456789:AAH... 처럼 '숫자:영문' 모양이어야 해요. BotFather 가 보낸 토큰만 복사해서 다시 넣어주세요."
            exit 1
          fi
          res="$(curl -sS -m 20 "https://api.telegram.org/bot$token/getMe" || true)"
          if ! echo "$res" | grep -q '"ok":true'; then
            echo "::error title=봇 토큰이 맞지 않아요::텔레그램이 이 토큰을 모른대요. BotFather → /mybots → 봇 선택 → API Token 에서 다시 복사해 주세요."
            exit 1
          fi

      - name: 알림 기억 공간(KV) 준비
        if: steps.ready.outputs.ok == 'true'
        run: |
          find_kv() {
            npx wrangler kv namespace list 2>/dev/null | node -e '
              const raw = require("fs").readFileSync(0, "utf8");
              let list = []; try { list = JSON.parse(raw.slice(raw.indexOf("["))); } catch {}
              const n = process.env.KV_NAME;
              const kv = list.find((k) => k.title === n) || list.find((k) => (k.title || "").endsWith(n));
              process.stdout.write(kv ? kv.id : "");'
          }
          id="$(find_kv)"
          if [ -z "$id" ]; then
            echo "처음이라 KV 를 만들어요."
            npx wrangler kv namespace create "$KV_NAME" || true
            id="$(find_kv)"
          fi
          if [ -z "$id" ]; then
            echo "::error title=KV 준비 실패::KV 를 찾지도 만들지도 못했어요. Cloudflare API 토큰에 'Workers KV Storage Edit' 권한이 있는지 확인해 주세요."
            exit 1
          fi
          sed -i "s/00000000000000000000000000000000/$id/" wrangler.toml

      - name: Worker 배포
        id: deploy
        if: steps.ready.outputs.ok == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          if [ -z "$url" ]; then
            echo "::error title=주소를 못 찾음::배포 주소(workers.dev)를 못 찾았어요."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 비밀값 등록
        if: steps.ready.outputs.ok == 'true'
        run: |
          run_secret="$(printf 'notion-tasks-sync-run:%s' "$NOTION_TOKEN" | sha256sum | cut -c1-48)"
          echo "::add-mask::$run_secret"
          echo "RUN_SECRET=$run_secret" >> "$GITHUB_ENV"
          RUN_SECRET="$run_secret" node -e '
            const keys = ["GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","GOOGLE_REFRESH_TOKEN","NOTION_TOKEN","NOTION_STATE_PAGE_ID","NOTION_TODO_DS_ID","NOTION_SHOPPING_DS_ID","RUN_SECRET","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID"];
            const out = {};
            for (const k of keys) { const v = (process.env[k] || "").trim(); if (v) out[k] = v; }
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));'
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: 확인 실행
        if: steps.ready.outputs.ok == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          MODE: ${{ inputs.mode }}
        run: |
          dry=1
          [ "$MODE" = "지금 바로 동기화" ] && dry=0
          # GitHub 에 들어 있는 설정값 이름 (값은 안 보여요)
          expected=""
          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN NOTION_TOKEN NOTION_STATE_PAGE_ID NOTION_TODO_DS_ID NOTION_SHOPPING_DS_ID TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            [ -n "${!k}" ] && expected="$expected $k"
          done
          echo "GitHub 설정값:$expected"
          # 새 버전·비밀값이 퍼질 때까지 몇 번 다시 시도
          for i in $(seq 1 18); do
            res="$(curl -sS -X POST "$URL/run?dry=$dry" -H "x-run-secret: $RUN_SECRET" || true)"
            if echo "$res" | grep -q '"ok":true'; then
              # 새 비밀값이 Cloudflare 전체에 퍼지기 전의 버전이 답했을 수 있음 → 다 보일 때까지 기다림
              missing_now=""
              for k in $expected; do echo "$res" | grep -q "\"$k\"" || missing_now="$missing_now $k"; done
              if [ -n "$missing_now" ] && [ "$i" -lt 18 ]; then
                echo "아직 반영 안 된 설정값:$missing_now — 기다리는 중"; sleep 5; continue
              fi
              break
            fi
            if echo "$res" | grep -q '"error"' && ! echo "$res" | grep -q '설정값'; then break; fi
            sleep 5
          done
          summary="$(printf '%s' "$res" | node -e '
            let r; try { r = JSON.parse(require("fs").readFileSync(0, "utf8")); } catch { console.log("응답을 읽지 못했어요"); process.exit(0); }
            const lines = Object.entries(r.lists || {}).map(([k, v]) => k + ": " + v);
            if (r.error) lines.push(r.error);
            const tg = { sent: "텔레그램 연결 메시지 보냄", already: "텔레그램 알림 켜짐", off: "텔레그램 알림 꺼짐", failed: "⚠️ 텔레그램 메시지를 못 보냈어요 (TELEGRAM_CHAT_ID 확인)" }[r.telegram] || "";
            const opt = ["NOTION_SHOPPING_DS_ID"].filter((k) => !(r.configured || []).includes(k));
            console.log((r.dry ? "[시험 실행] " : "[동기화] ") + lines.join(" / ") + " (요청 " + r.requests + "개)" + (tg ? " · " + tg : "") + (opt.length ? " · 아직 없는 설정값: " + opt.join(", ") : ""));')"
          echo "$summary"
          if echo "$res" | grep -q '"ok":true'; then
            echo "::notice title=배포 완료::$summary"
          else
            echo "::error title=확인 실행 실패::$summary"
            exit 1
          fi
